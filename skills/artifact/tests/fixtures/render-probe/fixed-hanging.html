<!-- render-probe fixture: fixed-over-text from a label hanging out of a 0-height fixed
     strip. The strip's own rect is empty, so a check on the container's rect sees
     nothing; the label it positions is drawn over the heading and the body text. -->
<style>
.stripfix { position: fixed; top: 3.6rem; left: 0; right: 0; height: 0; z-index: 30; }
.stripfix .lblfix { position: absolute; top: 0; left: 3rem; white-space: nowrap;
                    font-family: var(--sans); font-size: 1.4rem; }
</style>
<div class="page"><main class="main">
<h1>Etiqueta colgante del encabezado</h1>
<p>Primer párrafo del cuerpo, que queda debajo de la etiqueta mientras la página se lee.</p>
</main></div>
